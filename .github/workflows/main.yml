name: Build Mobs Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project archive
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Descompactando $ZIP_FILE..."
            unzip -o "$ZIP_FILE" -d temp_extract
            if [ -f "temp_extract/pubspec.yaml" ]; then
              cp -rf temp_extract/* .
            else
              SUBDIR=$(find temp_extract -mindepth 1 -maxdepth 1 -type d | head -n 1)
              cp -rf "$SUBDIR"/* .
            fi
            rm -rf temp_extract "$ZIP_FILE"
          fi

      - name: Rebrand to Mobs Android
        run: |
          find lib android/app/src/main/res -type f \( -name "*.dart" -o -name "*.xml" \) -exec sed -i 's/Moha Lab Boost/Mobs Android Boost/g' {} +
          find lib android/app/src/main/res -type f \( -name "*.dart" -o -name "*.xml" \) -exec sed -i 's/Moha Lab/Mobs Android/g' {} +
          find lib android/app/src/main/res -type f \( -name "*.dart" -o -name "*.xml" \) -exec sed -i 's/MohaLab/MobsAndroid/g' {} +
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            sed -i 's/android:label="[^"]*"/android:label="Mobs Android"/g' android/app/src/main/AndroidManifest.xml
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/applicationId = "[^"]*"/applicationId = "com.raylan.mobsandroid"/g' android/app/build.gradle.kts
          fi
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/applicationId "[^"]*"/applicationId "com.raylan.mobsandroid"/g' android/app/build.gradle
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mobs-Android-debug
          path: build/app/outputs/flutter-apk/*.apk
          
